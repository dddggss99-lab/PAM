<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="../css/styleCadastro.css">
    <link rel="stylesheet" href="../css/header.css">
</head>

<body>

    <div class="fundo"></div>

    <header>
        <header class="header">
            <img src="../imgHero/oc (1).png" alt="logo" class="logo">
        </header>

        <h1>Ficha de Cadastro</h1>
    </header>
    <Section>
        <form action="">
            <div>
                <label for="">NOME</label>
                <input name="nome" type="text">
            </div>
            <div>
                <label for="">EMAIL</label>
                <input type="text" name="email" id="">
            </div>

            <label for="">Choose a date:</label>
            <input type="date" id="date" name="trip-start">



            <div class="div_sexo">
                <label for="" class="sexo"> <span>MASC</span> <input name="sexo" value="MASC" type="radio"></label>
                <label for="" class="sexo"> <span>FEM</span> <input name="sexo" value="FEM" type="radio"></label>
                <label for="" class="sexo"> <span>OUTROS</span> <input name="sexo" value="OUTROS" type="radio"></label>
            </div>
            </div>


            <div class="div_button">
                <button type="button" id="btnCadastrar">
                    CADASTRAR
                </button>
            </div>
        </form>
    </Section>




</body>
<script src="../js/pagCadastro.js"></script>
<script src="../js/fundoCadastro.js"></script>

</html>
